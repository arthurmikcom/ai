# The phone app (mobile/) as an Android .apk, built on GitHub's machines (they have the Android SDK).
# The file is under Actions → this run → Artifacts → maryx-ai-android. Signed with the debug key:
# fine to install and test; Google Play needs the app's own key (see mobile/README.md).
name: Android APK

on:
  push:
    branches: [main, claude/busy-franklin-g1rexn]
    paths: ["mobile/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo prebuild --platform android --no-install
        env:
          CI: "1"
      - name: Build the .apk
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: maryx-ai-android
          path: mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 30
